name: Build project and check quality

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  # Weekly Beam compatibility check: runs the test suite against the latest Beam release
  # without releasing Asgarde. Opens an issue if a new Beam version breaks Asgarde.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      beam-version:
        description: 'Beam version to test against (empty = latest release on Maven Central)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-beam-version:
    name: Resolve latest Beam version
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      - name: Resolve Beam version from Maven Central
        id: resolve
        env:
          INPUT_BEAM_VERSION: ${{ inputs.beam-version }}
        run: |
          if [ -n "$INPUT_BEAM_VERSION" ]; then
            LATEST="$INPUT_BEAM_VERSION"
          else
            LATEST=$(curl -fsSL https://repo1.maven.org/maven2/org/apache/beam/beam-sdks-java-core/maven-metadata.xml \
              | grep -oP '(?<=<release>)[^<]+')
          fi
          echo "Latest Beam version: $LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Beam ${{ matrix.beam-label }}, JDK ${{ matrix.java }})
    needs: resolve-beam-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline: the Beam version Asgarde is compiled against (pom), on the lowest supported JDK.
          - beam-label: baseline
            java: '8'
            coverage: true
          # Latest Beam release (Beam >= 2.74.0 requires Java 11+).
          - beam-label: latest
            java: '17'
          - beam-label: latest
            java: '21'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        env:
          BEAM_VERSION: ${{ matrix.beam-label == 'latest' && needs.resolve-beam-version.outputs.latest || '' }}
        run: |
          mvn -B -ntp verify ${BEAM_VERSION:+-Dbeam.version=$BEAM_VERSION}

      - name: Generate test report
        # The token is read-only on PRs from forks: the check run can't be created there.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@v3
        with:
          name: Maven Tests (Beam ${{ matrix.beam-label }}, JDK ${{ matrix.java }})
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload coverage report
        if: always() && matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 30

  sonar:
    name: SonarCloud analysis
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: asgarde_ci_cd
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run tests with coverage and SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=tosun-si_asgarde \
            -Dsonar.organization=groupbees \
            -Dsonar.host.url=https://sonarcloud.io

  report-beam-regression:
    name: Report Beam regression
    needs: [ resolve-beam-version, test ]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the Beam compatibility issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BEAM_VERSION: ${{ needs.resolve-beam-version.outputs.latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Beam compatibility: tests fail with Beam $BEAM_VERSION"
          BODY="The weekly compatibility run failed against Beam \`$BEAM_VERSION\`: $RUN_URL"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
